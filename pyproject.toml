[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpuf-helpers"
version = "0.1.0"
description = "Turbopuffer helpers and command-line tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "turbopuffer>=2.10.2",
]

[project.scripts]
tpuf = "tpuf_helpers.cli:main"

[dependency-groups]
dev = [
    "flake8",
    "pre-commit>=4.6.2",
    "pyright",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["tpuf_helpers"]
